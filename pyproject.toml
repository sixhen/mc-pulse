[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-pulse"
version = "1.1.0"
description = "Minecraft TPS optimizer and server configuration auditor."
readme = "README.md"
authors = [{ name = "sixhen", email = "dmh190229@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["minecraft", "paper", "purpur", "spigot", "performance", "tps"]

[project.scripts]
mcpulse = "mcpulse.cli:main"
